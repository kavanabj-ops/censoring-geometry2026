[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "censoring-check"
version = "1.0.0"
description = "R0-R5 identifiability checklist for mutation-lineage interaction tests under censoring"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["numpy", "scipy"]

[project.scripts]
censoring-check = "censoring_check.cli:main"

[tool.setuptools]
packages = ["censoring_check"]
